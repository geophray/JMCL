name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  verify:
    # Windows because the net462 leg cannot be EXECUTED elsewhere: there is no
    # .NET Framework runtime on Linux or macOS. Compilation works anywhere via
    # Microsoft.NETFramework.ReferenceAssemblies; running the tests does not.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer derives the version from git history. A shallow clone
          # produces a wrong version with no error at all.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Deliberately the same script developers run locally. When CI and local
      # verification drift apart, CI stops being evidence about the thing you
      # are shipping. Git Bash is present on the Windows runners, and the script
      # runs both target frameworks there rather than skipping net462.
      - name: Verify
        shell: bash
        run: ./build/verify.sh

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: local-feed/*.nupkg
          if-no-files-found: error

  publish:
    # Only a tag publishes. main is always releasable but never auto-released.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    environment: nuget
    permissions:
      contents: read
      # Required for nuget.org trusted publishing: this job exchanges a
      # short-lived GitHub OIDC token for a temporary (1-hour) nuget.org API
      # key. Nothing long-lived is stored as a secret. The trusted publishing
      # policy on nuget.org must name this repo, this workflow file
      # (ci.yml), and the "nuget" environment, or the exchange is refused.
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: local-feed

      - uses: actions/setup-dotnet@v4

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          # nuget.org profile name, not email. Not a secret, but kept as a
          # repo/environment variable rather than hardcoded so it can change
          # without a code edit. Set it under Settings > Environments >
          # nuget > Variables (or repo-level Variables) as NUGET_USER.
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        # No --skip-duplicate. The upstream pipelines set allowPackageConflicts
        # true, which silently accepted a re-push of an existing version and hid
        # mistakes. A duplicate here should fail loudly, and so should a missing
        # or misconfigured trusted publishing policy rather than a silent skip.
        shell: bash
        run: |
          dotnet nuget push "local-feed/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
